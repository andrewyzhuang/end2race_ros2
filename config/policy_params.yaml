# policy_params v2 (2026-11-13): corridor baseline, track width W = 1.5 m.
# v1 backup is outside the repo: ros2node_mybranch/config_versions/policy_params_v1.yaml
end2race_policy_node:
  ros__parameters:
    # --- Mode & Runtime Selection ---
    # mode: "end2race" (neural policy) or "ftg" (Follow-the-Gap baseline)
    mode: "end2race"
    model_path: "models/end2race_policy_jit_fp16.pt"
    use_fp16: true
    # NeoRacer LakiBeam1 LiDAR runs at 30 Hz max
    control_rate_hz: 30.0

    # --- Recurrent GRU Architecture (Matched to imitation/model.py) ---
    num_beams: 180
    gru_hidden_dim: 420
    actions_are_normalized: false
    action_steer_index: 0
    action_speed_index: 1
    gru_stale_timeout_sec: 0.25

    # --- ROS 2 Topics (Matched to neoracer_ros2_driver) ---
    scan_topic: "/scan"
    speed_topic: "/encoder/speed"
    odom_topic: "/odom"
    imu_topic: "/imu/fused"
    drive_topic: "/drive"
    dotmatrix_topic: "/dotmatrix/text"

    # --- NeoRacer Hardware & Normalization Mapping ---
    # NeoRacer /drive expects normalized [-1.0, 1.0] by default.
    normalize_drive_output: true
    neoracer_max_physical_speed_m_s: 6.0
    # NeoRacer hardware maximum steering angle is 30.0 degrees = 0.5236 rad (from controller.yaml)
    neoracer_max_physical_steer_rad: 0.5236
    # End2Race policy physical steering limit from paper: 0.42 rad
    max_steer_rad: 0.42
    # NeoRacer vehicle test (11/6): positive steering command = left, negative = right.
    # Policy output follows F1TENTH Gym: +rad is left, -rad is right. So the sign is +1.0.
    steer_sign: 1.0
    steer_trim_normalized: 0.0

    # --- Sim-to-Real Domain Adaptation Scales ---
    # s_d = training track width / real track width = 2.2 m (Austin) / 1.5 m (corridor) = 1.467
    lidar_distance_scale: 1.467
    # Scales NeoRacer encoder speed (m/s) -> End2Race input speed (m/s)
    # s_d * (40 Hz / 30 Hz) = 1.467 * 1.333, so motion per control step matches training
    speed_input_scale: 1.956
    # Scales End2Race output speed (m/s) -> NeoRacer target speed (m/s). Inverse of speed_input_scale.
    speed_output_scale: 0.511
    # Hard safety speed ceiling in physical m/s (ramp up: 1.5 -> 3.0 -> 4.5 -> 6.0)
    max_speed_cap_m_s: 3.0
    min_speed_floor_m_s: 0.0

    # --- LiDAR Preprocessing & 270-deg Blind-Spot Handling ---
    # NeoRacer /scan (verified on the car, 11/6 and bag s1_2_walk): index 0 is the REAR, rotates
    # counter-clockwise (CCW), 1440 beams. scan_index0_at_rear rolls the scan by half a turn so the
    # rest of the pipeline sees index 0 = forward. No CW->CCW flip is needed.
    lidar_scan_clockwise: false
    scan_index0_at_rear: true
    # Standard 360 F1TENTH scan starts at -180 deg (rear) and goes CCW to +180 deg, OR 0 deg (front).
    shift_index_zero_to_rear: true
    # LakiBeam1 rear chassis occlusion wedge in degrees (measured CW from 0=forward)
    rear_blind_angle_min_deg: 135.0
    rear_blind_angle_max_deg: 225.0
    rear_blind_fill_distance_m: 10.0
    # Training scans go up to 30 m (simulator default max_range), not 10 m
    max_lidar_range_m: 30.0
    min_lidar_range_m: 0.05

    # Temporal persistence (seconds) on rear-quarter beams (90-135 deg & 225-270 deg)
    # Prevents premature cut-back collisions during Stage 5 of overtaking when opponent enters blind spot
    # v2: both off (0.0 and 1), because training had no such processing
    side_corridor_hold_sec: 0.0
    median_filter_window: 1

    # --- Safety Filter, Traction Circle & Drift-Assist Parameters ---
    # NeoRacer wheelbase from chassis specification: 280 mm = 0.28 m
    wheelbase_m: 0.28
    safety_margin_radius_m: 0.18
    # v2: lowered from 0.85 / 0.32, which would intervene on most training-like driving
    ttc_warning_sec: 0.50
    ttc_critical_sec: 0.25
    ttc_ebrake_speed_m_s: 0.0

    # Friction-circle lateral acceleration limit (m/s^2). Higher = less corner-entry throttle roll-off.
    enable_traction_circle: false
    max_lat_accel_m_s2: 5.5
    traction_min_speed_ratio: 0.45

    # IMU Yaw-rate drift assist (allows sideslip up to max_drift_yaw_error_rad_s before counter-steering)
    enable_yaw_damping: false
    max_drift_yaw_error_rad_s: 1.8
    yaw_damping_kp: 0.08

    # Actuator smoothing to prevent straight-line servo oscillation
    steering_ema_alpha: 1.0 # lower value = more smoothing
    max_steering_rate_rad_s: 3.2

lidar_diagnostics_node:
  ros__parameters:
    scan_topic: "/scan"
    # NeoRacer LakiBeam1 scan frequency is 30 Hz
    expected_hz: 30.0
    hz_tolerance_ratio: 0.20
    # About 25% of the NeoRacer scan is always inf (rear blind area). Replay shows 29 to 32% in total.
    max_invalid_beam_ratio: 0.35
    min_safe_distance_m: 0.25
